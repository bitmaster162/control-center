name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python scripts/validate.py
      - run: python -m pytest -q
      - name: Parse PS5.1 release entrypoints
        shell: pwsh
        run: |
          $files = @(
            'hanri_runtime/r28/scripts/Install-R29RC2SideBySide-PS51.ps1',
            'hanri_runtime/r28/scripts/Verify-R29RC2Runtime-PS51.ps1',
            'hanri_runtime/r28/scripts/Restore-R29RC1FromRC2.ps1',
            'hanri_runtime/r28/scripts/Install-R30ReleaseCandidate-PS51.ps1',
            'hanri_runtime/r28/scripts/Verify-R30Runtime-PS51.ps1',
            'hanri_runtime/r28/scripts/Restore-R29RC2FromR30.ps1',
            'hanri_runtime/r28/scripts/Install-R31ReleaseCandidate-PS51.ps1',
            'hanri_runtime/r28/scripts/Verify-R31Runtime-PS51.ps1',
            'hanri_runtime/r28/scripts/Restore-R30FromR31.ps1',
            'hanri_runtime/r28/scripts/Install-R32ReleaseCandidate-PS51.ps1',
            'hanri_runtime/r28/scripts/Verify-R32Runtime-PS51.ps1',
            'hanri_runtime/r28/scripts/Restore-R31FromR32.ps1',
            'hanri_runtime/r28/scripts/Install-R33ReleaseCandidate-PS51.ps1',
            'hanri_runtime/r28/scripts/Verify-R33Runtime-PS51.ps1',
            'hanri_runtime/r28/scripts/Restore-R32FromR33.ps1',
            'hanri_runtime/r28/scripts/Probe-R35SQLiteInventory-PS51.ps1'
          )
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $file))
            if ($bytes | Where-Object { $_ -gt 127 }) {
              Write-Error "Non-ASCII byte found in release entrypoint: $file"
              exit 1
            }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - run: node --check assets/app.js
      - name: Verify deterministic generated assets
        run: |
          python scripts/generate_snapshot_assets.py
          git diff --exit-code -- data/snapshot.js data/snapshot.sha256 HANRI_R64_DASHBOARD_STANDALONE_CONTRACT_V1.html
