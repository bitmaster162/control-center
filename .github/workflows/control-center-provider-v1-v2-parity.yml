name: Control Center Provider Snapshot V1-V2 Parity

on:
  push:
    branches:
      - control-center/current-truth-r1
    paths:
      - 'control_center/data/provider_snapshot.current.v1.json'
      - 'control_center/data/current_sync_evidence.review.v2.json'
      - 'control_center/data/provider_snapshot_v1_migration_map.review.v2.json'
      - 'control_center/scripts/migrate_provider_snapshot_v1_to_v2.py'
      - 'control_center/scripts/test_provider_snapshot_v1_to_v2_migration.py'
      - '.github/workflows/control-center-provider-v1-v2-parity.yml'
  pull_request:
    paths:
      - 'control_center/data/provider_snapshot.current.v1.json'
      - 'control_center/data/current_sync_evidence.review.v2.json'
      - 'control_center/data/provider_snapshot_v1_migration_map.review.v2.json'
      - 'control_center/scripts/migrate_provider_snapshot_v1_to_v2.py'
      - 'control_center/scripts/test_provider_snapshot_v1_to_v2_migration.py'
      - '.github/workflows/control-center-provider-v1-v2-parity.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate V1 to per-surface V2 migration parity
        run: >-
          python control_center/scripts/migrate_provider_snapshot_v1_to_v2.py
          control_center/data/provider_snapshot.current.v1.json
          control_center/data/current_sync_evidence.review.v2.json
          control_center/data/provider_snapshot_v1_migration_map.review.v2.json
      - name: Adversarial V1 to V2 migration tests
        run: python control_center/scripts/test_provider_snapshot_v1_to_v2_migration.py
      - name: Revalidate Sync V2 current evidence
        run: python control_center/scripts/control_center_sync_gate_v2.py --validate control_center/data/current_sync_evidence.review.v2.json
