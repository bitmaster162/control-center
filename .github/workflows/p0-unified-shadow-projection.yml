name: P0 Unified Shadow Projection

on:
  push:
    branches:
      - agent/p0-unified-shadow-projection-r1
  pull_request:
    branches:
      - control-center/current-truth-r1

permissions:
  contents: read

jobs:
  offline-shadow-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile P0 projection through R5 authenticated reveal
        run: |
          python -m py_compile control_center/scripts/unified_shadow_projection_p0.py control_center/scripts/test_unified_shadow_projection_p0.py control_center/scripts/replay_anchor_projection_p0.py control_center/scripts/test_replay_anchor_projection_p0.py control_center/scripts/replay_history_projection_p0.py control_center/scripts/test_replay_history_projection_p0.py control_center/scripts/domain_history_projection_p0.py control_center/scripts/test_domain_history_projection_p0.py control_center/scripts/human_approval_custody_p0.py control_center/scripts/test_human_approval_custody_p0.py control_center/scripts/authenticated_reveal_projection_p0.py control_center/scripts/test_authenticated_reveal_projection_p0.py
      - name: Run P0 projection through R5 authenticated reveal tests
        run: |
          python -m unittest control_center.scripts.test_unified_shadow_projection_p0 control_center.scripts.test_replay_anchor_projection_p0 control_center.scripts.test_replay_history_projection_p0 control_center.scripts.test_domain_history_projection_p0 control_center.scripts.test_human_approval_custody_p0 control_center.scripts.test_authenticated_reveal_projection_p0 -v
