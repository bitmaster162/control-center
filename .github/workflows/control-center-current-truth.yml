name: Control Center Current Truth Projection

on:
  push:
    branches:
      - control-center/current-truth-r1
    paths:
      - 'control_center/**'
      - '.github/workflows/control-center-current-truth.yml'
  pull_request:
    paths:
      - 'control_center/**'
      - '.github/workflows/control-center-current-truth.yml'

permissions:
  contents: read

jobs:
  validate-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate seed projection contract
        run: python control_center/scripts/validate_control_plane_projection.py control_center/data/current_control_plane.seed.v1.json
      - name: Check provider snapshot -> generated projection
        run: python control_center/scripts/compose_current_projection.py control_center/data/provider_snapshot.current.v1.json --check control_center/data/current_control_plane.generated.v1.json
      - name: Validate generated current projection
        run: python control_center/scripts/validate_generated_projection.py control_center/data/current_control_plane.generated.v1.json
      - name: Test current projection composer
        run: python control_center/scripts/test_current_projection_composer.py
      - name: Validate Agent Control Plane generated projection
        run: python control_center/scripts/validate_agent_control_plane.py
      - name: Adversarial Agent Control Plane self-tests
        run: python control_center/scripts/test_agent_control_plane.py
      - name: Validate work-order lifecycle projection
        run: python control_center/scripts/validate_work_order_lifecycle.py
      - name: Adversarial work-order lifecycle self-tests
        run: python control_center/scripts/test_work_order_lifecycle.py
      - name: Validate decision / effect gate ledger
        run: python control_center/scripts/validate_decision_effect_ledger.py
      - name: Adversarial decision / effect gate tests
        run: python control_center/scripts/test_decision_effect_ledger.py
      - name: Validate effect execution / readback plane
        run: python control_center/scripts/validate_effect_readback_plane.py
      - name: Adversarial effect / readback receipt tests
        run: python control_center/scripts/test_effect_readback_plane.py
      - name: Validate Command Queue V1
        run: python control_center/scripts/validate_command_queue.py
      - name: Adversarial Command Queue tests
        run: python control_center/scripts/test_command_queue.py
      - name: Validate Human Gate Packet V1
        run: python control_center/scripts/validate_human_gate_packets.py
      - name: Adversarial Human Gate Packet tests
        run: python control_center/scripts/test_human_gate_packets.py
      - name: Validate Execution Scope Binder V1
        run: python control_center/scripts/validate_execution_scope_binder.py
      - name: Adversarial Execution Scope Binder tests
        run: python control_center/scripts/test_execution_scope_binder.py
      - name: Validate Broker Health Readback V1
        run: python control_center/scripts/validate_broker_health_readback.py
      - name: Adversarial Broker Health Readback tests
        run: python control_center/scripts/test_broker_health_readback.py
      - name: Validate Canonical Contract Repair Proposal V1
        run: python control_center/scripts/validate_canonical_contract_repair_proposal.py
      - name: Validate applied Canonical Contract Repair receipt
        run: python control_center/scripts/validate_canonical_contract_repair_execution_receipt.py
      - name: Reduce bounded source-envelope fixture
        run: python control_center/scripts/reduce_source_envelopes.py control_center/data/source_envelopes.example.v1.json
      - name: Adversarial reducer self-tests
        run: python control_center/scripts/test_source_reducer.py
      - name: Validate exact Return Registry V4 adapter
        run: python control_center/scripts/test_return_registry_adapter.py
      - name: Validate operator cockpit JavaScript
        run: |
          node --check control_center/ui/app.js
          node --check control_center/ui/lifecycle.js
          node --check control_center/ui/decision_ledger.js
          node --check control_center/ui/effect_readback.js
          node --check control_center/ui/command_queue.js
          node --check control_center/ui/human_gate_packets.js
          node --check control_center/ui/execution_scope.js
