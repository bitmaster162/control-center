name: Control Center Current Truth Projection

on:
  push:
    branches:
      - control-center/current-truth-r1
    paths:
      - 'control_center/**'
      - '.github/workflows/control-center-current-truth.yml'
  pull_request:
    paths:
      - 'control_center/**'
      - '.github/workflows/control-center-current-truth.yml'

permissions:
  contents: read

jobs:
  validate-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate seed projection contract
        run: python control_center/scripts/validate_control_plane_projection.py control_center/data/current_control_plane.seed.v1.json
      - name: Check provider snapshot -> generated projection
        run: python control_center/scripts/compose_current_projection.py control_center/data/provider_snapshot.current.v1.json --check control_center/data/current_control_plane.generated.v1.json
      - name: Validate generated current projection
        run: python control_center/scripts/validate_generated_projection.py control_center/data/current_control_plane.generated.v1.json
      - name: Test current projection composer
        run: python control_center/scripts/test_current_projection_composer.py
      - name: Validate Agent Control Plane generated projection
        run: python control_center/scripts/validate_agent_control_plane.py
      - name: Adversarial Agent Control Plane self-tests
        run: python control_center/scripts/test_agent_control_plane.py
      - name: Validate work-order lifecycle projection
        run: python control_center/scripts/validate_work_order_lifecycle.py
      - name: Adversarial work-order lifecycle self-tests
        run: python control_center/scripts/test_work_order_lifecycle.py
      - name: Reduce bounded source-envelope fixture
        run: python control_center/scripts/reduce_source_envelopes.py control_center/data/source_envelopes.example.v1.json
      - name: Adversarial reducer self-tests
        run: python control_center/scripts/test_source_reducer.py
      - name: Validate exact Return Registry V4 adapter
        run: python control_center/scripts/test_return_registry_adapter.py
      - name: Validate operator cockpit JavaScript
        run: |
          node --check control_center/ui/app.js
          node --check control_center/ui/lifecycle.js
